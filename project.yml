name: CleanSpace
options:
  bundleIdPrefix: com.cleanspace
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    AD_HOC_CODE_SIGNING_ALLOWED: YES

targets:
  CleanSpace:
    type: application
    platform: iOS
    sources:
      - path: CleanSpace/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanspace.app
        INFOPLIST_FILE: CleanSpace/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
